name: lello
description: Flutter app for Lello Condominiuns and their clients as managers.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.32.2+562

environment:
  sdk: ">=3.6.0 <4.0.0"

dependency_overrides:
  win32: ^5.5.4
  intl: 0.20.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  essentials:
    path: ../app-lello-essentials/
  shared_features:
    path: ../app-lello-shared/
  lib_facedetection:
    path: ../app-lello-shared/packages/lib_facedetection/
  dropdown_button2: ^3.1.0

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.34.0
  chopper_generator: ^8.7.0
  dependency_validator: ^5.0.2
  flutter_launcher_icons: ^0.14.3
  json_serializable: ^6.0.0

flutter_app_name:
  name: "Lello Moradores"

flutter_icons:
  image_path: "assets/logo_lello.png"
  android: true
  ios: true
  adaptive_icon_background: "#df1e3f"
  adaptive_icon_foreground: "assets/logo_lello_adaptive.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/
    - lang/

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/playfairdisplay.ttf
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Black.ttf
        - asset: fonts/Roboto-Bold.ttf
        - asset: fonts/Roboto-Regular.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
