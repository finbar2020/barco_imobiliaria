name: example
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  lib_facedetection:
    path: ../../lib_facedetection/

  essentials:
    path: ../../../../app-lello-essentials/

  shared_features:
    path: ../../../../app-lello-shared/

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  # rules and activating additional ones.
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - lang/
    - assets/
