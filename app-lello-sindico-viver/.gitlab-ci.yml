# ==========================================================
# IOS DEPLOYMENTS
# ==========================================================

# --- 1. FIREBASE (ADHOC) ---
# Roda nas branches: homolog, flutter_update, feature/*

# App Original (Lello)
ios_firebase_internal_deployment:
  stage: firebase_deployment
  resource_group: $CI_PROJECT_PATH
  retry: 2
  needs: 
    - pre_build_shared
    - pre_build_essentials
    - pre_build_sindico
    - job: determine_environment
      optional: true
      artifacts: true
  variables:
    LC_ALL: "en_US.UTF-8"
    LANG: "en_US.UTF-8"
  before_script:
    - gem list bundler -i -v $BUNDLER_VERSION || gem install bundler -v $BUNDLER_VERSION
    - fvm flutter precache --ios
    - fvm flutter pub get
    - cd ios/
    - sh update_target_version.sh
    - rm -rf Pods .symlinks
    - bundle _${BUNDLER_VERSION}_ install
    - bundle exec pod install --repo-update
  script:
    - |
      ENV="${DEPLOY_ENV:-homolog}"
      echo "🚀 Building iOS Firebase — flavor:lello environment:$ENV"
      bundle exec fastlane ios firebase flavor:lello environment:$ENV ci_commit:"$(git log -1 --pretty=%B)"
  artifacts:
    paths:
      - ios/Runner.ipa
    expire_in: 2 week
  after_script: 
    - echo "Build finished"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "homolog" || $CI_COMMIT_REF_NAME == "flutter_update"'
    - if: '$TARGET_BRANCH && $TARGET_BRANCH == $CI_COMMIT_REF_NAME'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*/'

# App Novo (Hubert) - Herda configuração do Lello, mas muda o script
