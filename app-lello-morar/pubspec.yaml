name: morar
description: Flutter app for Lello Condominios and their clients as residents.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.33.2+545

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  essentials:
    path: ../app-lello-essentials/
  shared_features:
    path: ../app-lello-shared/
  lib_facedetection:
    path: ../app-lello-shared/packages/lib_facedetection/

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_annotation: ^4.12.0
  build_runner: ^2.5.4
  drift_dev: ^2.34.0
  chopper_generator: ^8.7.0
  dependency_validator: ^5.0.2
  flutter_launcher_icons: ^0.14.3
  json_serializable: ^6.0.0
  mocktail: ^1.0.5

dependency_overrides:
  intl: 0.20.2

flutter_app_name:
  name: "Lello Moradores"

flutter_icons:
  image_path: "assets/logo_lello.png"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - lang/

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/playfairdisplay.ttf
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Black.ttf
        - asset: fonts/Roboto-Bold.ttf
        - asset: fonts/Roboto-Regular.ttf

flutter_intl:
  enabled: true
  main_locale: "pt_BR"

scripts:
  builder_complete: dart run build_runner build --delete-conflicting-outputs
  builder: dart run build_runner build
