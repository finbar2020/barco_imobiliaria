remove_build_folder:
  stage: remove_build_folder
  resource_group: $CI_PROJECT_PATH
  script:
    # 🧹 Limpa artefatos de build desta pipeline
    - echo "🧹 Cleaning pipeline build directory..."
    - PIPELINE_DIR="$CI_BUILDS_DIR/$CI_PIPELINE_ID"
    - |
      if [ -d "$PIPELINE_DIR" ]; then
        echo "  🗑 Removing $PIPELINE_DIR"
        rm -rf "$PIPELINE_DIR"
      fi
    - echo "✅ Pipeline build directory cleaned successfully."
  rules:
    - if: '$CI_COMMIT_REF_NAME == "homolog" || $CI_COMMIT_REF_NAME == "flutter_update" || $CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_BRANCH =~ /^release\/.*/ || $CI_COMMIT_BRANCH =~ /^feature\/.*/'
      when: always
    - if: "$TARGET_BRANCH && $TARGET_BRANCH == $CI_COMMIT_REF_NAME"
      when: always
