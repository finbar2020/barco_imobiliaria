# Atualiza Perfis de Provisionamento
update_provisioning_profiles:
  stage: update_provisioning_profiles
  resource_group: $CI_PROJECT_PATH
  retry: 2
  needs:
    - determine_environment
    - pre_build_shared
    - pre_build_essentials
  before_script:
    - cd ios/
    - gem list bundler -i -v $BUNDLER_VERSION || gem install bundler -v $BUNDLER_VERSION
    - bundle _${BUNDLER_VERSION}_ install
  script:
    - bundle exec fastlane match adhoc
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "homolog" || $CI_COMMIT_REF_NAME == "flutter_update" || $CI_COMMIT_BRANCH =~ /^release\/.*/ || $CI_COMMIT_BRANCH =~ /^feature\/.*/'
    - if: "$TARGET_BRANCH && $TARGET_BRANCH == $CI_COMMIT_REF_NAME"

# IOS DEPLOYMENTS
ios_firebase_internal_deployment:
  stage: firebase_deployment
  resource_group: $CI_PROJECT_PATH
  retry: 2
  needs:
    - update_provisioning_profiles
  variables:
    LC_ALL: "en_US.UTF-8"
    LANG: "en_US.UTF-8"
  before_script:
    - gem list bundler -i -v $BUNDLER_VERSION || gem install bundler -v $BUNDLER_VERSION
    - cd ios/
    - sh update_target_version.sh
    - fvm flutter precache --ios
    - fvm flutter pub get
    - bundle _${BUNDLER_VERSION}_ install
    - bundle exec pod install --repo-update
  script:
    - bundle exec fastlane ios firebase environment:$DEPLOY_ENV ci_commit:"$(echo $DEPLOY_ENV | tr '[:lower:]' '[:upper:]') - $(git log -1 --pretty=%B)"
  artifacts:
    paths:
      - ios/Runner.ipa
      - ios/buildlog/**
    expire_in: 2 week
  after_script:
    - echo "Build finished"
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "homolog" || $CI_COMMIT_REF_NAME == "flutter_update" || $CI_COMMIT_BRANCH =~ /^release\/.*/ || $CI_COMMIT_BRANCH =~ /^feature\/.*/'
    - if: "$TARGET_BRANCH && $TARGET_BRANCH == $CI_COMMIT_REF_NAME"

